name: Flutter Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: flutter-android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host
        run: flutter create --platforms=android --android-language java --project-name=hyouka_phone --org=com.hyouka --no-pub .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hyouka-phone-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
