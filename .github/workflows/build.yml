          watch_setting = "org.gradle.vfs.watch=false"
          if watch_setting not in gradle_text:
              gradle_props.write_text(
                  gradle_text.rstrip() + "\n" + watch_setting + "\n"
              )

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.READ_CONTACTS"/>',
              '<uses-permission android:name="android.permission.CALL_PHONE"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '<uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>',
              '<uses-permission android:name="android.permission.READ_PHONE_STATE"/>',
              '<uses-permission android:name="android.permission.ANSWER_PHONE_CALLS"/>',
          ]
          for permission in permissions:
              if permission not in s:
                  s = s.replace(
                      "\n    <application",
                      "\n    " + permission + "\n    <application",
                      1,
                  )

          s = s.replace('android:label="phone"', 'android:label="هاتف"')
          s = s.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/app_icon"',
          )
          s = s.replace(
              'android:roundIcon="@mipmap/ic_launcher_round"',
              'android:roundIcon="@drawable/app_icon"',
          )

          dial_filter_generic = "\n".join([
              "        <intent-filter>",
              '              <action android:name="android.intent.action.DIAL" />',
              '              <category android:name="android.intent.category.DEFAULT" />',
              "        </intent-filter>",
          ]) + "\n"
          dial_filter_tel = "\n".join([
              "        <intent-filter>",
              '              <action android:name="android.intent.action.DIAL" />',
              '              <category android:name="android.intent.category.DEFAULT" />',
              '              <data android:scheme="tel" />',
              "        </intent-filter>",
          ]) + "\n"

          activity_start = s.find("    <activity")
          activity_end = s.find("    </activity>", activity_start)
          if activity_start < 0 or activity_end < 0:
              raise RuntimeError("Main activity block not found in generated manifest")

          if 'android.intent.action.DIAL' not in s:
              s = s[:activity_end] + dial_filter_generic + dial_filter_tel + s[activity_end:]
          elif 'data android:scheme="tel"' not in s:
              s = s[:activity_end] + dial_filter_tel + s[activity_end:]

          if 'android:name=".InCallActivity"' not in s:
              activity = "\n".join([
                  "    <activity",
                  '          android:name=".InCallActivity"',
                  '          android:exported="false"',
                  '          android:excludeFromRecents="true"',
                  '          android:launchMode="singleTop"',
                  '          android:showWhenLocked="true"',
                  '          android:turnScreenOn="true"',
                  '          android:theme="@android:style/Theme.Material.NoActionBar">',
                  "    </activity>",
              ]) + "\n"
              s = s.replace("    </application>", activity + "    </application>", 1)

          if 'android:name=".PhoneInCallService"' not in s:
              service = "\n".join([
                  "    <service",
                  '          android:name=".PhoneInCallService"',
                  '          android:permission="android.permission.BIND_INCALL_SERVICE"',
                  '          android:exported="true">',
                  '          <meta-data android:name="android.telecom.IN_CALL_SERVICE_UI" android:value="true" />',
                  '          <meta-data android:name="android.telecom.IN_CALL_SERVICE_CAR_MODE_UI" android:value="false" />',
                  '          <intent-filter>',
                  '              <action android:name="android.telecom.InCallService" />',
                  '          </intent-filter>',
                  "      </service>",
              ]) + "\n"
              s = s.replace("    </application>", service + "    </application>", 1)

          p.write_text(s)
