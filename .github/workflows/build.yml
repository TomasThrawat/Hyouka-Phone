name: Flutter Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: flutter-android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host
        run: flutter create --platforms=android --android-language java --project-name=phone --org=com.dailer --no-pub .

      - name: Configure Android app
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/icon.png android/app/src/main/res/drawable/app_icon.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android.permission.READ_CONTACTS' not in s:
              s = s.replace('\n    <application', '\n    <uses-permission android:name="android.permission.READ_CONTACTS"/>\n    <application', 1)
          s = s.replace('android:label="phone"', 'android:label="هاتف"')
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/app_icon"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/app_icon"')
          p.write_text(s)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build arm64 release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Show APK sizes
        run: ls -lh build/app/outputs/flutter-apk/release/*.apk

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v6
        with:
          name: هاتف-arm64-v8a-release-apk
          path: build/app/outputs/flutter-apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
